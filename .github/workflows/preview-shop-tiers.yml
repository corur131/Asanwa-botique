name: Preview Shop Tiers (feature branch only)

on:
  push:
    branches:
      - feature/batch-1-shop-tiers-10202801017554009125
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write

jobs:
  build-and-preview:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install --legacy-peer-deps --no-audit --no-fund
      - name: Type-check
        run: npx tsc --noEmit
      - name: Build frontend
        run: npm run build
        env:
          VITE_AI_API_BASE_URL: https://asanwa-botique.onrender.com
      - name: Check Firebase deployment secret
        id: key
        env:
          SA: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: |
          if [ -n "$SA" ]; then
            echo "ok=1" >> "$GITHUB_OUTPUT"
          else
            echo "FIREBASE_SERVICE_ACCOUNT secret is not configured; preview deploy cannot run."
            exit 1
          fi
      - name: Deploy temporary Firebase preview (never live)
        if: steps.key.outputs.ok == '1'
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          channelId: shop-tiers-preview
          expires: 7d
