name: Validate shop relocation
on:
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  shop-relocation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --legacy-peer-deps --no-audit --no-fund
      - run: npm test
      - run: npx tsc --noEmit
      - run: npm run build
        env:
          VITE_AI_API_BASE_URL: https://asanwa-botique.onrender.com
