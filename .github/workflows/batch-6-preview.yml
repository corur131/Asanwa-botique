name: Batch 6 Preview

on:
  pull_request:
    branches:
      - "feature/batch-5-power-utilities"
    types: [opened, synchronize, reopened]

permissions:
  contents: read
  pull-requests: write
  checks: write
  deployments: write

jobs:
  preview:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --legacy-peer-deps --no-audit --no-fund
      - run: npm run check:locale-safe
      - run: npm test
      - name: Run Batch 6 contract economy check
        run: python3 tools/economy-sim/batch6_contracts.py
      - run: npx tsc --noEmit
      - name: Build isolated preview
        run: npm run build
        env:
          VITE_AI_API_BASE_URL: https://asanwa-botique.onrender.com
          # Keep preview saves browser-local and separate from the live Firebase database.
          VITE_FAKE_CLOUD: '1'
      - name: Check deploy key
        id: key
        env:
          SA: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: if [ -n "$SA" ]; then echo "ok=1" >> "$GITHUB_OUTPUT"; else echo "FIREBASE_SERVICE_ACCOUNT secret is not set; preview deploy skipped"; fi
      - if: steps.key.outputs.ok == '1'
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          channelId: batch-6-pr-${{ github.event.number }}
          expires: 7d
