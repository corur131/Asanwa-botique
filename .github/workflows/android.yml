# Builds the installable Android app (APK) on every push to main and publishes it as a GitHub release.
# Needs two repository secrets (ANDROID_KEYSTORE_B64, KEYSTORE_PASSWORD) and android-config/google-services.json.
name: Android app

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: android
  cancel-in-progress: false

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check signing secrets and Firebase file
        env:
          ANDROID_KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_B64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
        run: |
          if [ -z "$ANDROID_KEYSTORE_B64" ] || [ -z "$KEYSTORE_PASSWORD" ]; then
            echo "::error::Add the ANDROID_KEYSTORE_B64 and KEYSTORE_PASSWORD secrets in Settings > Secrets and variables > Actions, then run this workflow again."
            exit 1
          fi
          if [ ! -f android-config/google-services.json ]; then
            echo "::error::android-config/google-services.json is missing. Download it from the Firebase console (Android app com.corur131.asanwaboutique)."
            exit 1
          fi

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Install dependencies
        run: npm install --legacy-peer-deps --no-audit --no-fund

      - name: Build the game
        run: npm run build
        env:
          VITE_AI_API_BASE_URL: https://asanwa-botique.onrender.com
          VITE_APP_BUILD: ${{ github.run_number }}

      - name: Create Android project
        run: |
          npx cap add android
          cp android-config/google-services.json android/app/google-services.json
          printf '\next {\n    rgcfaIncludeGoogle = true\n}\n' >> android/variables.gradle

      - name: Generate app icon and splash
        continue-on-error: true
        run: npx --yes @capacitor/assets@3.0.5 generate --android --iconBackgroundColor '#2A1430' --iconBackgroundColorDark '#2A1430' --splashBackgroundColor '#2A1430' --splashBackgroundColorDark '#160A1A'

      - name: Copy game into Android project
        run: npx cap sync android

      - name: Set version
        run: |
          sed -i "s/versionCode 1$/versionCode ${GITHUB_RUN_NUMBER}/" android/app/build.gradle
          sed -i "s/versionName \"1.0\"/versionName \"1.${GITHUB_RUN_NUMBER}\"/" android/app/build.gradle

      - name: Build signed APK
        env:
          ANDROID_KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_B64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
        run: |
          echo "$ANDROID_KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/release.jks"
          cd android
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon \
            -Pandroid.injected.signing.store.file="$RUNNER_TEMP/release.jks" \
            -Pandroid.injected.signing.store.password="$KEYSTORE_PASSWORD" \
            -Pandroid.injected.signing.key.alias=chopcount \
            -Pandroid.injected.signing.key.password="$KEYSTORE_PASSWORD"
          cp app/build/outputs/apk/release/app-release.apk "$GITHUB_WORKSPACE/asanwa-boutique.apk"

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "v1.${GITHUB_RUN_NUMBER}" asanwa-boutique.apk \
            --title "Asanwa Boutique 1.${GITHUB_RUN_NUMBER}" \
            --notes "Download asanwa-boutique.apk and install it over your current app. Your progress is saved to your Google account." \
            --latest
