name: Financial regression tests

on:
  push:
    branches: ['main', 'feature/**', 'audit/**']
  pull_request:
    branches: [main, 'audit/**']
  workflow_dispatch:

jobs:
  financial-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --legacy-peer-deps --no-audit --no-fund
      - run: npm test
      - run: npx tsc --noEmit
      - run: npm run build
        env:
          VITE_AI_API_BASE_URL: https://asanwa-botique.onrender.com
