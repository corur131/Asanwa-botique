name: Batch 1 verification

on:
  push:
    branches:
      - feature/batch-1-seven-tier-shops
  pull_request:
    branches:
      - main

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Check out code
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install Node dependencies
        run: npm install --no-audit --no-fund
      - name: Run automated game tests
        run: npm test
      - name: Check TypeScript
        run: npm run lint
      - name: Build production bundle
        run: npm run build
      - name: Simulate the seven-tier economy
        run: python tools/economy-sim/final.py 0.12
      - name: Save economy simulation results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: batch-1-economy-simulation
          path: results.json
          if-no-files-found: ignore
