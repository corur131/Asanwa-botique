name: Validate game
# No lockfile is committed, so setup-node cache is intentionally disabled.

on:
  push:
    branches:
      - "feature/**"
  pull_request:
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --legacy-peer-deps --no-audit --no-fund
      - run: npm run check:locale-safe
      - run: npm test
      - name: Run Batch 6 contract economy check
        run: python3 tools/economy-sim/batch6_contracts.py
      - run: npx tsc --noEmit
      - run: npm run build
