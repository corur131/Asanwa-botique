# Every push to main builds the game and puts it live on Firebase Hosting.
# Needs one repository secret: FIREBASE_SERVICE_ACCOUNT (see SETUP-FIREBASE.md).
name: Deploy to Firebase Hosting

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --legacy-peer-deps --no-audit --no-fund
      - run: npx tsc --noEmit
      - name: Build frontend for Firebase Hosting
        run: npm run build
        env:
          VITE_AI_API_BASE_URL: https://asanwa-botique.onrender.com
      - name: Check the deploy key is set
        id: key
        env:
          SA: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: if [ -n "$SA" ]; then echo "ok=1" >> "$GITHUB_OUTPUT"; else echo "FIREBASE_SERVICE_ACCOUNT secret is not set yet, skipping deploy"; fi
      - if: steps.key.outputs.ok == '1'
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          channelId: live
